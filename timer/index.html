<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Timer</title>
  <style>
    :root {
      --night: #141820;
      --night-soft: #1e2433;
      --twilight: #2a3347;
      --saffron: #e8940a;
      --saffron-glow: #f5a623;
      --saffron-deep: #b87208;
      --gold: #d4af37;
      --gold-light: #f0c75e;
      --cream: #f8f4ec;
      --cream-dim: rgba(248, 244, 236, 0.72);
      --ink: #1a1510;
      --stop: #4a3232;
      --stop-hover: #5c3d3d;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--cream);
      background: var(--night);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(232, 148, 10, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
        linear-gradient(165deg, var(--night) 0%, var(--twilight) 45%, var(--night-soft) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 1;
    }

    .screen.is-active { display: flex; }

    #config {
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }

    #config.mobile.landscape { flex-direction: row; }

    .config__button {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      -webkit-tap-highlight-color: transparent;
      transition: filter 0.2s ease, transform 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .config__button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 40%);
      pointer-events: none;
    }

    .config__button:active {
      filter: brightness(0.92);
      transform: scale(0.995);
    }

    .config__button--15 {
      background: linear-gradient(160deg, var(--saffron-glow) 0%, var(--saffron) 50%, var(--saffron-deep) 100%);
    }

    .config__button--30 {
      background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 45%, var(--saffron-deep) 100%);
    }

    .config__label {
      font-size: clamp(4rem, 22vw, 9rem);
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.03em;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.25);
      position: relative;
    }

    #config.mobile.landscape .config__label {
      transform: rotate(-90deg);
      font-size: clamp(3rem, 12vh, 7rem);
    }

    #play {
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .play__timer {
      flex: 2;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
    }

    .timer-stage {
      position: relative;
      width: min(72vmin, 360px);
      height: min(72vmin, 360px);
      display: grid;
      place-items: center;
    }

    .timer-wheel {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      user-select: none;
      overflow: visible;
      opacity: 0.28;
      filter: brightness(0.55) saturate(0.7);
    }

    #timer {
      grid-area: 1 / 1;
      position: relative;
      z-index: 1;
      font-size: clamp(3.25rem, 17vw, 7.5rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #fff8e7;
      letter-spacing: 0.08em;
      text-shadow:
        0 0 20px rgba(0, 0, 0, 0.9),
        0 2px 12px rgba(0, 0, 0, 1),
        0 0 40px rgba(0, 0, 0, 0.6);
    }

    .play__controls {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
    }

    .play__button {
      flex: 1;
      width: 50%;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.75rem, 7vw, 3rem);
      font-weight: 600;
      color: var(--cream);
      -webkit-tap-highlight-color: transparent;
      transition: filter 0.15s ease;
    }

    .play__button:active { filter: brightness(0.9); }

    #pause-btn {
      background: linear-gradient(180deg, var(--saffron-glow) 0%, var(--saffron) 100%);
      color: var(--ink);
    }

    #pause-btn.resume {
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 100%);
    }

    #stop-btn {
      background: linear-gradient(180deg, #6b4545 0%, var(--stop) 100%);
    }
  </style>
</head>
<body>

  <div id="config" class="screen is-active">
    <button type="button" class="config__button config__button--15" data-minutes="15">
      <span class="config__label">15 min</span>
    </button>
    <button type="button" class="config__button config__button--30" data-minutes="30">
      <span class="config__label">30 min</span>
    </button>
  </div>

  <div id="play" class="screen">
    <div class="play__timer">
      <div class="timer-stage">
        <svg class="timer-wheel" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="wheel-gold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f5d06a"/>
              <stop offset="45%" stop-color="#d4af37"/>
              <stop offset="100%" stop-color="#a67c00"/>
            </linearGradient>
            <linearGradient id="wheel-rim" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#e8c04a"/>
              <stop offset="100%" stop-color="#9a7209"/>
            </linearGradient>
            <linearGradient id="wheel-hub" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fff9ed"/>
              <stop offset="100%" stop-color="#e6c56a"/>
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="94" fill="none" stroke="url(#wheel-rim)" stroke-width="11"/>
          <g transform="translate(100 100)" stroke="url(#wheel-gold)" stroke-width="2.4" stroke-linecap="round">
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(0)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(15)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(30)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(45)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(60)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(75)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(90)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(105)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(120)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(135)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(150)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(165)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(180)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(195)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(210)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(225)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(240)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(255)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(270)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(285)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(300)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(315)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(330)"/>
            <line x1="0" y1="-82" x2="0" y2="-40" transform="rotate(345)"/>
          </g>
          <g fill="url(#wheel-gold)">
            <circle cx="100" cy="18" r="3.2"/>
            <circle cx="131.5" cy="26.5" r="3.2"/>
            <circle cx="156.5" cy="51.5" r="3.2"/>
            <circle cx="173.5" cy="82" r="3.2"/>
            <circle cx="173.5" cy="118" r="3.2"/>
            <circle cx="156.5" cy="148.5" r="3.2"/>
            <circle cx="131.5" cy="173.5" r="3.2"/>
            <circle cx="100" cy="182" r="3.2"/>
            <circle cx="68.5" cy="173.5" r="3.2"/>
            <circle cx="43.5" cy="148.5" r="3.2"/>
            <circle cx="26.5" cy="118" r="3.2"/>
            <circle cx="26.5" cy="82" r="3.2"/>
            <circle cx="43.5" cy="51.5" r="3.2"/>
            <circle cx="68.5" cy="26.5" r="3.2"/>
          </g>
          <polygon points="100,86 114,100 100,114 86,100" fill="url(#wheel-hub)" stroke="#b8922a" stroke-width="1.8"/>
        </svg>
        <div id="timer">15:00</div>
      </div>
    </div>
    <div class="play__controls">
      <button type="button" id="pause-btn" class="play__button">Pause</button>
      <button type="button" id="stop-btn" class="play__button">Stop</button>
    </div>
  </div>

  <script>
    var config = document.getElementById('config');
    var play = document.getElementById('play');
    var timer = document.getElementById('timer');
    var pauseBtn = document.getElementById('pause-btn');
    var stopBtn = document.getElementById('stop-btn');

    var msLeft = 0;
    var tracks = [];
    var audio = null;
    var playing = true;
    var clock = null;

    var CLOSING_MS = (2 * 60 + 56) * 1000;
    var TRACKS = [
      { src: 'audio/intro-chanting.mp3', chain: true },
      { src: 'audio/intro-instructions.mp3', chain: true },
      { src: 'audio/closing-chanting.mp3', atMs: CLOSING_MS }
    ];

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      config.classList.add('mobile');
    }

    function onLandscape() {
      config.classList.toggle('landscape', window.matchMedia('(orientation: landscape)').matches);
    }
    onLandscape();
    window.addEventListener('resize', onLandscape);

    function formatTime(ms) {
      var s = Math.max(0, Math.round(ms / 1000));
      var m = Math.floor(s / 60);
      s = s % 60;
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    function show(which) {
      config.classList.toggle('is-active', which === 'config');
      play.classList.toggle('is-active', which === 'play');
    }

    function playTrack() {
      if (!tracks.length) return;
      var track = tracks.shift();
      if (audio) audio.pause();
      audio = new Audio(track.src);
      audio.onended = function () {
        if (tracks.length && tracks[0].chain) playTrack();
      };
      if (playing) audio.play();
    }

    function onTick() {
      if (!playing) return;
      msLeft -= 1000;
      timer.textContent = formatTime(msLeft);
      if (tracks.length && tracks[0].atMs != null && msLeft <= tracks[0].atMs) {
        playTrack();
      }
      if (msLeft <= 0) stop();
    }

    function start(minutes) {
      msLeft = minutes * 60 * 1000;
      tracks = TRACKS.map(function (t) { return { src: t.src, chain: t.chain, atMs: t.atMs }; });
      playing = true;
      pauseBtn.textContent = 'Pause';
      pauseBtn.classList.remove('resume');
      timer.textContent = formatTime(msLeft);
      show('play');
      playTrack();
      clearInterval(clock);
      clock = setInterval(onTick, 1000);
    }

    function stop() {
      playing = false;
      clearInterval(clock);
      if (audio) audio.pause();
      audio = null;
      tracks = [];
      show('config');
    }

    config.onclick = function (e) {
      var btn = e.target.closest('[data-minutes]');
      if (btn) start(Number(btn.getAttribute('data-minutes')));
    };

    pauseBtn.onclick = function () {
      playing = !playing;
      if (playing) {
        pauseBtn.textContent = 'Pause';
        pauseBtn.classList.remove('resume');
        if (audio) audio.play();
      } else {
        pauseBtn.textContent = 'Resume';
        pauseBtn.classList.add('resume');
        if (audio) audio.pause();
      }
    };

    stopBtn.onclick = stop;
  </script>
</body>
</html>
